name: Didar Gold CI/CD - Self-Hosted Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: Verify, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Production Build Verification
        run: npm run build

  deploy_to_server:
    name: Deploy to Self-Hosted Server
    needs: test_and_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Self-Hosted Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Didar Gold Deployment on Self-Hosted Server..."
            
            # Navigate to project deployment directory
            DEPLOY_DIR=${{ secrets.DEPLOY_PATH || '/var/www/didar-gold' }}
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Pull latest changes from Git
            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Build and restart containers using Docker Compose
            echo "🐳 Building and starting Docker containers..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d

            # Clean dangling images
            docker image prune -f

            echo "✅ Didar Gold successfully deployed to port 3000!"
