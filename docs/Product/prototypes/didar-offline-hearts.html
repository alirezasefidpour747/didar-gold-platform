const btn=(label,action,primary=false,extra='')=>`<button type="button" class="dc-button ${primary?'dc-primary':''}" data-action="${action}" ${extra}>${label}</button>`;
const link=(label,action,extra='')=>`<button type="button" class="dc-link" data-action="${action}" ${extra}>${label}</button>`;
const heading=(title,sub='')=>`<div class="dc-title"><div><h1>${title}</h1>${sub?`<p class="dc-muted">${sub}</p>`:''}</div></div>`;
const info=(label,value)=>`<div><dt>${label}</dt><dd>${value}</dd></div>`;
const name=()=>state.profile.name||t('store');
const locAddress=()=>state.profile.address||t('addressValue');
const pieceById=id=>{for(const m of models){const p=m.pieces.find(p=>p.uid===id);if(p)return {...p,modelId:m.id};}return null;};
const isMember=()=>state.mode!=='guest';
const isBuyer=()=>state.mode==='retailer';
const initIcons=()=>{}; // Icons already included in every render.
let photo=(m,clickable=false)=>`<${clickable?'button type="button"':'div'} class="dc-photo" ${clickable?`data-action="product" data-id="${m.id}" aria-label="${t('product'+m.id)}"`:''}><img src="${productImages[m.id]}" alt="${t('product'+m.id)}" width="440" height="440"><span class="dc-photo-tag">${t(['heritage','signature','occasion','signature'][m.id])}</span></${clickable?'button':'div'}>`;

function shell(){
root.lang=state.locale;root.dir=['fa','ar'].includes(state.locale)?'rtl':'ltr';
const nav=isConsumer()?['catalog','nearby','warranty','resale','serviceRequests']:isPartner()?['supplierProfile','supplierProducts','catalog']:isRetailerMode()?['catalog','requests','orders','shipments','profile']:['catalog'];
const roleLabel=isBuyer()?'retailer':state.mode==='pending'?'pending':isConsumer()?'roleConsumerShort':state.mode==='supplier'?'roleSupplierShort':state.mode==='wholesaler'?'roleWholesalerShort':'guest';
root.innerHTML=`<div class="dc-demo">${t('preview')}</div><header class="dc-header"><button type="button" class="dc-brand" data-action="catalog"><span class="dc-wordmark" dir="ltr">DIDAR</span><span class="dc-brand-sub">${isRetailerMode()?esc(name()):t('heroTag')}</span></button><div class="dc-row"><select id="dc-locale" class="dc-locale" aria-label="${t('language')}">${[['fa','فارسی'],['ar','العربية'],['en','English'],['fr','Français']].map(([l,x])=>`<option value="${l}" ${l===state.locale?'selected':''}>${x}</option>`).join('')}</select><button type="button" class="dc-button dc-primary" data-action="my-didar" aria-expanded="${state.menuOpen}" aria-controls="dc-my-menu">${icon('user-round')}${t('myDidar')}${icon(state.menuOpen?'chevron-up':'chevron-down')}</button>${isMember()?link(t('signout'),'signout'):''}${!isMember()||isRetailerMode()?btn(icon('shopping-bag')+t('cart')+' '+n(state.basket.length),'cart'):''}</div></header><section id="dc-my-menu" class="dc-role-menu" ${state.menuOpen?'':'hidden'} aria-label="${t('myDidar')}"><div class="dc-row dc-between"><h2>${t('chooseRole')}</h2>${link(t('closeMenu'),'close-menu')}</div>${isMember()?`<p class="dc-small dc-muted">${t('roleSwitchNote')}</p>`:''}<div class="dc-role-grid">${roles.map(r=>`<button type="button" class="dc-role-card" data-action="choose-role" data-id="${r.id}"><span class="dc-role-icon">${icon(r.icon)}</span><strong>${t(r.label)}</strong><span class="dc-small dc-muted">${t(r.desc)}</span></button>`).join('')}</div></section><nav class="dc-nav" aria-label="${t('portal')}">${nav.map(k=>`<button type="button" data-action="${k}" ${state.page===k||k==='catalog'&&['product','shop'].includes(state.page)?'aria-current="page"':''}>${t(k)}</button>`).join('')}<span class="dc-badge" style="margin-inline-start:auto">${t(roleLabel)}</span></nav><main class="dc-main"><div class="dc-feedback" role="status" aria-live="polite">${state.toastKey?t(state.toastKey):''}</div>${state.mode==='pending'?`<div class="dc-notice">${t('pendingMembership')}</div>`:''}${page()}</main><footer class="dc-footer"><span>${t('footer')}</span><span>${t('imageNote')}</span></footer>`;
initIcons();
}
function catalog(){return `<section class="dm-hero"><div class="dm-hero-copy"><span class="dm-kicker">${t('heroTag')}</span><h1>${t('maisonTitle')}</h1><p>${t('maisonSub')}</p><button class="dc-button dm-gold-button" type="button" data-action="explore">${t('explore')}${icon('arrow-down')}</button></div><button class="dm-hero-image" type="button" data-action="product" data-id="1" aria-label="${t('product1')}"><img src="${productImages[1]}" alt="${t('product1')}" width="440" height="440"></button></section><section class="dm-catalog" id="dm-catalog"><div class="dc-title"><div><div class="dc-eyebrow">${t('editorial')}</div><h2>${t(isRetailerMode()?'catalogMember':'catalogTitle')}</h2></div></div><label class="dc-field dm-search"><span class="dc-small">${t('search')}</span><input id="dc-search" type="search" value="${esc(state.search)}" placeholder="${t('search')}" autocomplete="off"></label><div class="dm-filters" aria-label="${t('category')}">${['all','rings','bracelets','necklaces','earrings','bangles','sets'].map(k=>`<button type="button" class="dm-filter" data-action="category-filter" data-id="${k}" aria-pressed="${state.category===k}">${t(k)}</button>`).join('')}</div><div class="dm-collections"><span class="dc-small">${t('collections')}</span>${['allCollections','signature','heritage','occasion'].map(k=>`<button type="button" class="dm-collection" data-action="collection-filter" data-id="${k}" aria-pressed="${state.collection===k}">${t(k)}</button>`).join('')}</div><div id="dc-products" class="dc-grid" aria-live="polite">${cards()}</div></section><section class="dm-editorial"><div><span class="dm-kicker">DIDAR COLLECTIONS</span><h2>${t('collections')}</h2></div><div class="dm-collection-grid">${['signature','heritage','occasion'].map((k,i)=>`<button type="button" class="dm-collection-card" data-action="collection-jump" data-id="${k}"><img src="${productImages[[1,0,2][i]]}" alt="" width="440" height="440"><span>${t(k)} ${icon('arrow-up-left')}</span></button>`).join('')}</div></section>`;}

function cards(only=null){const q=state.search.trim().toLowerCase();const list=only||models.filter(m=>(state.category==='all'||m.category===state.category)&&(state.collection==='allCollections'||['heritage','signature','occasion','signature'][m.id]===state.collection)&&(!q||[t('product'+m.id),m.sku,...m.pieces.map(x=>x.uid)].join(' ').toLowerCase().includes(q)));
return list.map(m=>`<article class="dc-product">${photo(m,true)}<div class="dc-product-copy"><div class="dc-small dc-muted">${t(m.category)} · ${n(750)} / ${n(1000)}</div><h2>${link(t('product'+m.id),'product',`data-id="${m.id}"`)}</h2><div class="dc-small">${t('weightRange')}: ${weightRange(m)}</div><bdi class="dc-code">${m.sku}</bdi><p class="dc-small dc-muted">${t('storyText')}</p>${btn(t('discover'),'product',true,`data-id="${m.id}"`)}${isConsumer()?btn(t('findStockists'),'locate-product',true,`data-id="${m.id}"`):isRetailerMode()?btn(t('buy'),'buy',true,`data-id="${m.id}"`):''}</div></article>`).join('')||`<div class="dc-empty dc-span">${t('noResults')}${btn(t('resetFilters'),'reset-filters')}</div>`;}
function product(){const m=models.find(m=>m.id===state.modelId);return `${link(icon(root.dir==='rtl'?'arrow-right':'arrow-left')+t('backCatalog'),'catalog')}<div class="dc-detail ${isRetailerMode()||isPartner()?'dc-member':''}"><div class="dc-detail-main"><div class="dc-product-hero">${photo(m)}<div class="dc-product-info"><div><div class="dc-eyebrow">${t(m.category)} · <bdi class="dc-code">${m.sku}</bdi></div><h1>${t('product'+m.id)}</h1><p class="dc-muted">${t('desc'+m.id)}</p></div><dl class="dc-info">${info(t('purity'),`${n(750)} / ${n(1000)}`)}${info(t('material'),t('yellowGold'))}${info(t('finish'),t(m.id===3?'matte':'polished'))}${info(t('stones'),t('noStones'))}${info(t('weightRange'),weightRange(m))}${info(t('assay'),t('assayPending'))}</dl><div><h3>${t('story')}</h3><p>${t('storyText')}</p></div>${isConsumer()?btn(icon('map-pin')+t('findStockists'),'locate-product',true,`data-id="${m.id}"`):isRetailerMode()?`<div class="dc-small dc-muted">${t('terms')}: ${t('toConfirm')}</div>`:isPartner()?btn(t('partnerEntry'),'partnerEntry'):`<div class="dc-small dc-muted">${t('priceAfterLogin')}</div><div class="dc-row">${btn(t('add'),'guest-add',true)}${btn(t('buy'),'guest-buy')}</div>${link(icon('map-pin')+t('findStockists'),'locate-product',`data-id="${m.id}"`)}`}</div></div>${isRetailerMode()?selection(m):''}</div>${!isMember()||isConsumer()?stockists(m):''}</div>`;}
function stockists(m){if(isConsumer())return `<aside class="dc-box" data-stockists><h2>${t('nearestTitle')}</h2>${locationPicker()}<div class="dc-small dc-muted">${t('sampleDistance')}</div>${nearbyResults(m)}</aside>`;return `<aside class="dc-box" data-stockists><h2>${t('stockists')}</h2><p class="dc-small dc-muted">${t('stockistsSub')}</p>${m.shops.filter(id=>id!==0||(state.shopPublished&&ownedPieces().some(x=>x.modelId===m.id&&state.shopVisible.includes(x.uid)))).map(id=>`<article class="dc-stockist"><h3>${t('shop'+id)}</h3><p class="dc-small dc-muted">${t('shopAddress'+id)}</p><span class="dc-badge">${t('shopAvailable')}</span><div>${link(t('more'),'shop',`data-id="${id}"`)}</div></article>`).join('')}<p class="dc-small dc-muted">${t('availabilityNote')}</p></aside>`;}
function shop(){const id=state.shopId;return `${link(t(state.shopReturnPage==='nearby'?'nearestTitle':'backProduct'),'back-shop')}<div style="margin-top:18px">${heading(t('shop'+id),t('publicShop'))}</div><div class="dc-box"><dl class="dc-info">${info(t('address'),t('shopAddress'+id))}${info(t('email'),`<bdi class="dc-code">gallery${id+1}@example.test</bdi>`)}${info(t('status'),t('active'))}</dl><div class="dc-notice dc-small">${t('availabilityNote')}</div></div><h2 style="margin:22px 0 14px">${t('shopProducts')}</h2><div class="dc-grid">${cards(models.filter(m=>m.shops.includes(id)))}</div>`;}
function selection(m){return `<section class="dc-box"><h2>${t('pieceTitle')}</h2><p class="dc-small dc-muted">${t('pieceSub')}</p>${m.pieces.map(p=>{const held=state.basket.some(x=>x.uid===p.uid),sent=state.submitted.has(p.uid),disabled=!isBuyer()||!p.available||held||sent;return `<label class="dc-piece"><input type="checkbox" data-piece="${p.uid}" ${state.selected.has(p.uid)?'checked':''} ${disabled?'disabled':''} aria-label="${t('select')} ${p.uid}"><div><bdi class="dc-code">${p.uid}</bdi><div class="dc-small dc-muted">${t('source')}: ${t(p.source)}</div></div><div>${wt(p.mg)}<div class="dc-small dc-muted">${t(sent?'alreadySubmitted':held?'already':p.available?'available':'unavailable')}</div></div></label>`;}).join('')}<div class="dc-notice dc-small">${t('notReserved')}</div><div id="dc-selection-error" role="alert" class="dc-error">${state.errorKey?t(state.errorKey):''}</div><div class="dc-actions"><span id="dc-selection-count">${t('selected')}: ${n(state.selected.size)}</span><div class="dc-row">${state.intent?.action==='buy'?btn(t('buy'),'buy-now',true,isBuyer()?'':'disabled')+btn(t('add'),'add',false,isBuyer()?'':'disabled'):btn(t('add'),'add',true,isBuyer()?'':'disabled')+btn(t('buy'),'buy-now',false,isBuyer()?'':'disabled')}</div></div></section>`;}
function auth(){const r=roles.find(x=>x.id===state.loginRole)||roles[0];return `<div class="dc-auth">${heading(t('roleLogin'))}<div class="dc-box"><div class="dc-row">${icon(r.icon)}<h2>${t(r.label)}</h2></div><p class="dc-muted">${t(r.desc)}</p>${link(t('changeRole'),'my-didar')}</div>${state.intent&&['retailer','consumer'].includes(state.loginRole)?`<div class="dc-box"><div class="dc-small dc-muted">${t('selected')}</div><h3>${t('product'+state.intent.modelId)}</h3><p class="dc-small dc-muted">${t('loginResume')}</p></div>`:''}<form id="dc-login" class="dc-box"><div class="dc-notice dc-small">${t('demoLogin')}</div><label class="dc-field">${t('demoEmail')}<input type="email" name="email" value="${esc(state.authEmail)}" required dir="ltr" autocomplete="off"></label><div class="dc-actions"><button type="submit" class="dc-button dc-primary">${t('enterDemo')}</button></div></form>${state.loginRole==='retailer'?`<div>${link(t('register'),'register')}</div>`:''}<div>${link(t('cancel'),'cancel-login')}</div></div>`;}
function registration(){return `<div class="dc-auth">${heading(t('registerTitle'))}<form id="dc-registration" class="dc-box"><div class="dc-notice dc-small">${t('demoLogin')}</div><div class="dc-stack"><label class="dc-field">${t('displayName')}<input name="name" required maxlength="100"></label><label class="dc-field">${t('city')}<input name="city" required maxlength="80"></label><label class="dc-field">${t('email')}<input name="email" type="email" required dir="ltr" value="retailer@example.test"></label></div><div class="dc-actions"><button type="submit" class="dc-button dc-primary">${t('apply')}</button></div></form>${link(t('cancel'),'signin')}</div>`;}
function itemsHtml(items,removable=false){return items.map(p=>`<div class="dc-lineitem"><div><h3>${t('product'+p.modelId)}</h3><bdi class="dc-code">${p.uid}</bdi><div class="dc-small dc-muted">${t('source')}: ${t(p.source)}</div></div><div>${wt(p.mg)}${removable?`<div>${link(t('remove'),'remove',`data-id="${p.uid}"`)}</div>`:''}</div></div>`).join('');}
function totals(items){return `<div class="dc-summary"><div><div class="dc-small dc-muted">${t('count')}</div><div class="dc-total">${n(items.length)}</div></div><div><div class="dc-small dc-muted">${t('totalWeight')}</div><div class="dc-total">${wt(items.reduce((a,x)=>a+x.mg,0))}</div></div></div><div class="dc-small dc-muted">${t('basis')}</div><div class="dc-lineitem"><span>${t('terms')}</span><strong>${t('toConfirm')}</strong></div>`;}
function basket(){return `${heading(t('cartTitle'),t('cartSub'))}${state.basket.length?`<div class="dc-box">${itemsHtml(state.basket,true)}${totals(state.basket)}</div><div class="dc-notice dc-small">${t('notReserved')}</div><div class="dc-actions">${link(t('goCatalog'),'catalog')}${btn(t('checkout'),'checkout',true,isBuyer()?'':'disabled')}</div>`:`<div class="dc-empty"><h2>${t('empty')}</h2>${btn(t('browse'),'catalog',true)}</div>`}`;}
const contactValue=k=>state.contact[k]||(k==='recipient'?t('recipientSample'):k==='city'?(state.profile.city||t('citySample')):k==='address'?locAddress():'');
function checkout(){return `${heading(t('checkoutTitle'))}<form id="dc-checkout" class="dc-box"><div class="dc-form"><label class="dc-field">${t('recipient')}<input name="recipient" required maxlength="100" value="${esc(contactValue('recipient'))}"></label><label class="dc-field">${t('phone')}<input name="phone" type="tel" required maxlength="32" value="${esc(contactValue('phone'))}" dir="ltr" autocomplete="off"></label><label class="dc-field dc-span">${t('delivery')}<select name="delivery" id="dc-delivery">${['shipping','pickup'].map(k=>`<option value="${k}" ${state.delivery===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="dc-field">${t('city')}<input name="city" required maxlength="80" value="${esc(contactValue('city'))}"></label><label class="dc-field">${t('address')}<input name="address" ${state.delivery==='shipping'?'required':''} maxlength="500" value="${esc(contactValue('address'))}"></label><label class="dc-field dc-span">${t('notes')}<textarea name="notes" maxlength="500">${esc(state.contact.notes)}</textarea></label></div><div class="dc-actions">${link(t('backCart'),'cart')}<button type="submit" class="dc-button dc-primary">${t('review')}</button></div></form>`;}
function review(){return `${heading(t('reviewTitle'))}<div class="dc-stack"><div class="dc-box">${itemsHtml(state.basket)}${totals(state.basket)}</div><div class="dc-box"><dl class="dc-info">${info(t('requester'),esc(name()))}${info(t('recipient'),esc(state.contact.recipient))}${info(t('phone'),`<bdi>${esc(state.contact.phone)}</bdi>`)}${info(t('delivery'),t(state.delivery))}${info(t('city'),esc(state.contact.city))}${info(t('address'),state.delivery==='shipping'?esc(state.contact.address):t('pickup'))}</dl>${state.contact.notes?`<p>${esc(state.contact.notes)}</p>`:''}</div></div><div class="dc-notice">${t('purchaseNote')}</div><div class="dc-actions">${link(t('checkoutTitle'),'checkout')}${btn(t('send'),'submit',true,isBuyer()?'':'disabled')}</div>`;}
function requestView(){const r=state.requests.find(x=>x.id===state.requestId);if(!r)return requestList();return `${link(t('requests'),'requests')}<div style="margin-top:16px">${heading(t('received'),`<bdi class="dc-code">${r.id}</bdi>`)}</div><div class="dc-stack"><div class="dc-box"><span class="dc-badge">${t('pending')}</span><div class="dc-step dc-step-current"><span class="dc-step-marker">${n(1)}</span>${t('created')}</div><div class="dc-step"><span class="dc-step-marker">${n(2)}</span>${t('pricing')}</div><div class="dc-step"><span class="dc-step-marker">${n(3)}</span>${t('approved')}</div><div class="dc-notice dc-small">${t('purchaseNote')}</div></div><div class="dc-box">${itemsHtml(r.items)}${totals(r.items)}</div><div class="dc-box"><dl class="dc-info">${info(t('requester'),esc(r.storeName))}${info(t('delivery'),t(r.delivery))}${info(t('recipient'),esc(r.contact.recipient))}${info(t('address'),r.delivery==='shipping'?esc(r.contact.address):t('pickup'))}</dl></div></div><div class="dc-actions">${btn(t('goCatalog'),'catalog',true)}</div>`;}
function requestList(){return `${heading(t('requests'))}${state.requests.length?`<div class="dc-stack">${state.requests.map(r=>`<article class="dc-box"><div class="dc-row dc-between"><h2><bdi class="dc-code">${r.id}</bdi></h2><span class="dc-badge">${t('pending')}</span></div><p class="dc-muted">${n(r.items.length)} ${t('pieces')} · ${wt(r.items.reduce((a,p)=>a+p.mg,0))}</p><div class="dc-actions">${link(t('viewRequest'),'request-detail',`data-id="${r.id}"`)}</div></article>`).join('')}</div>`:`<div class="dc-empty"><p>${t('noRequests')}</p>${btn(t('goCatalog'),'catalog',true)}</div>`}`;}
function orderList(){return `${heading(t('orders'),t('sampleRecords'))}<article class="dc-box"><div class="dc-row dc-between"><h2><bdi class="dc-code">${sampleOrder.id}</bdi></h2><span class="dc-badge">${t('approved')}</span></div><dl class="dc-info">${info(t('count'),n(sampleOrder.items.length))}${info(t('shippingStatus'),t('inTransit'))}</dl><div class="dc-actions">${link(t('viewOrder'),'order-detail')}</div></article>`;}
function orderDetail(){return `${link(t('orders'),'orders')}<div style="margin-top:16px">${heading(t('order')+' '+sampleOrder.id,t('sampleRecords'))}</div><div class="dc-stack"><div class="dc-box"><dl class="dc-info">${info(t('relatedRequest'),`<bdi class="dc-code">${sampleOrder.requestId}</bdi>`)}${info(t('status'),t('approved'))}${info(t('paymentStatus'),t('unknown'))}${info(t('shippingStatus'),t('inTransit'))}</dl></div><div class="dc-box">${itemsHtml(sampleOrder.items)}</div><div class="dc-box"><div class="dc-row dc-between"><div>${t('shipment')} <bdi class="dc-code">${sampleOrder.shipmentId}</bdi></div>${link(t('viewShipment'),'shipment-detail')}</div></div></div>`;}
function shipmentList(){return `${heading(t('shipments'),t('sampleRecords'))}<article class="dc-box"><div class="dc-row dc-between"><h2><bdi class="dc-code">${sampleOrder.shipmentId}</bdi></h2><span class="dc-badge">${t('inTransit')}</span></div><p>${t('relatedOrder')}: <bdi class="dc-code">${sampleOrder.id}</bdi></p><div class="dc-actions">${link(t('viewShipment'),'shipment-detail')}</div></article>`;}
function shipmentDetail(){return `${link(t('shipments'),'shipments')}<div style="margin-top:16px">${heading(t('shipment')+' '+sampleOrder.shipmentId,t('sampleRecords'))}</div><div class="dc-stack"><div class="dc-box"><dl class="dc-info">${info(t('relatedOrder'),sampleOrder.id)}${info(t('carrier'),t('carrierSample'))}${info(t('tracking'),'<bdi class="dc-code">DEMO-TRK-048</bdi>')}${info(t('address'),t('addressValue'))}</dl><div class="dc-actions">${link(t('viewOrder'),'order-detail')}</div></div><div class="dc-box">${['preparing','inTransit','delivered'].map((k,i)=>`<div class="dc-step ${i===1?'dc-step-current':''}"><span class="dc-step-marker">${n(i+1)}</span>${t(k)}${i===1?`<span class="dc-badge">${t('status')}</span>`:''}</div>`).join('')}</div><div class="dc-box">${itemsHtml(sampleOrder.items)}</div></div>`;}
function profile(){return `${heading(t('profileTitle'),t('profileSub'))}<div class="dc-stack"><div class="dc-box"><dl class="dc-info">${info(t('retailerCode'),'<bdi class="dc-code">RT-DEMO-001</bdi>')}${info(t('status'),t(isBuyer()?'active':'pending'))}${info(t('membership'),t('owner'))}</dl></div><form id="dc-profile" class="dc-box"><div class="dc-form"><label class="dc-field">${t('displayName')}<input name="name" required maxlength="100" value="${esc(name())}"></label><label class="dc-field">${t('city')}<input name="city" required maxlength="80" value="${esc(state.profile.city||t('citySample'))}"></label><label class="dc-field dc-span">${t('email')}<input type="email" name="email" maxlength="254" dir="ltr" value="${esc(state.profile.email)}"></label><label class="dc-field dc-span">${t('address')}<textarea name="address" required maxlength="500">${esc(locAddress())}</textarea></label></div><div class="dc-actions"><button type="submit" class="dc-button dc-primary">${t('save')}</button></div></form></div>`;}
function page(){
const retailerPages=['cart','checkout','review','requests','request-detail','orders','order-detail','shipments','shipment-detail','profile'];
const consumerPages=['nearby','warranty','resale','serviceRequests','service-detail'];
if(retailerPages.includes(state.page)&&!isRetailerMode())return denied();
if(consumerPages.includes(state.page)&&!isConsumer())return denied();
if(state.page==='partnerEntry'&&!isPartner())return denied();
if(state.mode==='pending'&&['orders','order-detail','shipments','shipment-detail'].includes(state.page))return heading(t(state.page.startsWith('order')?'orders':'shipments'))+'<div class="dc-empty">'+t('noHistory')+'</div>';

state.menuOpen=false;
if(action==='choose-role'){const r=roles.find(x=>x.id===id);if(!r)return;const intent=['product','nearby'].includes(state.page)?{modelId:state.modelId,action:id==='consumer'?'locate':'add'}:['login','register'].includes(state.page)?state.intent:null;const previous=['login','register'].includes(state.page)?state.returnPage:state.page;if(isMember())clearSession();state.returnPage=['catalog','product','shop'].includes(previous)?previous:'catalog';state.intent=intent;state.loginRole=id;state.authEmail=id+'@example.test';state.page='login';return;}
if(['catalog','requests','orders','shipments','profile','cart'].includes(action)){if(action!=='catalog'&&!isRetailerMode()){if(!isMember())beginLogin(null,'retailer');return;}state.page=action;state.selected.clear();}
else if(action==='product'){if(!models.some(m=>m.id===Number(id)))return;state.modelId=Number(id);state.page='product';state.selected.clear();state.intent=null;}
else if(action==='shop'){if(!models.some(m=>m.shops.includes(Number(id))))return;state.shopId=Number(id);state.shopReturnPage=state.page==='nearby'?'nearby':'product';state.page='shop';}
else if(action==='back-shop'){state.page=state.shopReturnPage;}
else if(action==='return-product'){state.page='product';}
else if(action==='signin'){beginLogin(state.intent,'retailer');}
else if(action==='guest-add'||action==='guest-buy'){if(isMember())return;beginLogin({modelId:state.modelId,action:action==='guest-buy'?'buy':'add'},'retailer');}
else if(action==='buy'){if(!isRetailerMode())return;state.modelId=Number(id);state.selected.clear();state.intent={modelId:state.modelId,action:'buy'};state.page='product';}
else if(action==='locate-product'){if(!models.some(m=>m.id===Number(id)))return;state.modelId=Number(id);if(!isMember())beginLogin({modelId:state.modelId,action:'locate'},'consumer');else if(isConsumer())state.page='nearby';}
else if(['nearby','warranty','resale','serviceRequests'].includes(action)){if(!isConsumer())return;state.page=action;}
else if(action==='service-detail'){if(!isConsumer()||!state.services.some(s=>s.id===id))return;state.serviceId=id;state.page='service-detail';}
else if(action==='partnerEntry'){if(!isPartner())return;state.page='partnerEntry';}
else if(action==='cancel-login'){state.page=['catalog','product','shop'].includes(state.returnPage)?state.returnPage:'catalog';state.intent=null;}
else if(action==='register'){if(state.loginRole!=='retailer'||isMember())return;state.page='register';}
else if(action==='signout'){clearSession();state.page='catalog';}
else if(action==='add'){addSelection(false);}
else if(action==='buy-now'){addSelection(true);}
else if(action==='remove'){if(!isBuyer())return;state.basket=state.basket.filter(p=>p.uid!==id);}
else if(action==='checkout'){if(!isBuyer()||!state.basket.length)return;state.page='checkout';}

else if(action==='request-detail'){if(!isRetailerMode())return;state.requestId=id;state.page='request-detail';}
else if(action==='order-detail'||action==='shipment-detail'){if(!isRetailerMode())return;state.page=action;}
}

if(action==='resale-card'&&isConsumer()){state.resaleWarranty=id;state.page='resale';return;}

-info">${info(t('selectProduct'),x.model===null?'—':t('product'+x.model))}${info(t('quantity'),n(x.qty))}${info(t('goldUnit'),n(x.gold,3))}${info(t('cashUnit'),n(x.cash))}${info(t('status'),t('approved'))}</dl></details>`).join('')||t('noHistory')}</div>`;}

const rvOldRegistry=registry;

const rvOldShell=shell;

const rvFileOK=f=>f&&f.size>0&&f.size<=2*1024*1024&&['application/pdf','image/jpeg','image/png'].includes(f.type);

function v5ScopeSummary(p){return `<span class="dc-small">${t('selectedScopes')}: ${n(p.scope.length)}</span><div class="v5-tags">${p.scope.map(id=>{const s=v5ByType(id);return s?`<span>${t(v5ByCategory(s.category).label)} / ${t(s.label)}</span>`:'';}).join('')}</div>`;}
supplierProfile=function(){v5SupplierData();const p=state.supplierProfile;return `${heading(t('supplierProfile'))}<form id="v5-supplier-profile"><fieldset class="v5-form-section"><legend>${t('identitySection')}</legend><div class="dc-form">${selectField('legalType',['person','organization'],p.entity)}${selectField('supplierType',['manufacturer','wholesaler','otherSupplier'],p.type)}${p.entity==='person'?v5Input('fullName',p.fullName,'required')+v5Input('personId',p.personId,'required inputmode="numeric" pattern="[0-9]{10}" dir="ltr" maxlength="10"'):v5Input('companyName',p.companyName,'required')+v5Input('companyId',p.companyId,'required inputmode="numeric" pattern="[0-9]{11}" dir="ltr" maxlength="11"')+v5Input('registrationNo',p.registrationNo,'required dir="ltr"')+v5Input('representative',p.representative,'required')+v5Input('representativeId',p.representativeId,'required inputmode="numeric" pattern="[0-9]{10}" dir="ltr" maxlength="10"')}${v5Input('businessName',p.businessName,'required')}${v5Input('brand',p.brand)}</div></fieldset><fieldset class="v5-form-section"><legend>${t('contactSection')}</legend><div class="dc-form">${['phone','officePhone','email','province','city','address','postal'].map(k=>v5Input(k,p[k],(k==='email'?'type="email" ':['phone','officePhone'].includes(k)?'type="tel" ':'')+(['phone','officePhone','email','postal'].includes(k)?'dir="ltr" ':'')+(['phone','province','city','address'].includes(k)?'required':''))).join('')}</div></fieldset><fieldset class="v5-form-section"><legend>${t('licenseSection')}</legend>${['businessLicense','productionLicense'].map(k=>`<label class="v5-check"><input type="checkbox" data-v5-license-type="${k}" ${p.licenses.includes(k)?'checked':''}>${t(k)}</label>${p.licenses.includes(k)?`<div class="dc-form v5-license-block">${v5Input(k+'Number',p[k+'Number'],'required dir="ltr"')}<label class="dc-field">${t('licenseUpload')} · ${t(k)}<input type="file" data-v5-license-file="${k}" accept="application/pdf,image/jpeg,image/png"><small>${t('fileLimit')}</small>${p[k+'File']?`<span>${esc(p[k+'File'].name)}</span>`:''}</label></div>`:''}`).join('')}${p.type==='manufacturer'?`<label class="v5-check"><input type="checkbox" name="hasT" id="v5-has-t" ${p.hasT?'checked':''}>${t('hasT')}</label>${p.hasT?v5Input('tCode',p.tCode,'required dir="ltr"'):''}`:''}</fieldset>${v5ScopePicker(p)}<div class="dc-actions">${btn(t('saveDraft'),'v5-save-profile')}<button type="submit" class="dc-button dc-primary" ${v5Uploads?'disabled':''}>${t('reviewSupplier')}</button></div><p role="status">${p.reviewStatus?t(p.reviewStatus):t('draftStatus')}</p></form>`;};
v5Label('businessLicenseNumber',['شماره مجوز کسب','رقم الرخصة التجارية','Business licence number','Numéro de licence commerciale']);
v5Label('productionLicenseNumber',['شماره مجوز تولید','رقم رخصة الإنتاج','Production licence number','Numéro de licence de production']);
function v5NewProduct(){return {id:null,productName:'',sku:'',family:'',category:'',subcategory:'',purity:'',minWeight:'',maxWeight:'',nominalWeight:'',quantity:'',issuer:'',segmentCount:'',segmentWeight:'',story:'',photos:[],status:'draft'};}
function v5SetProductTax(p,k,value){p[k]=value;if(k==='family'){p.category='';p.subcategory='';p.nominalWeight='';p.purity='';}if(k==='category'){const c=v5ByCategory(value);p.family=c?.family||'';p.subcategory=c?.types.length===1?c.types[0].id:'';p.nominalWeight='';p.purity='';}if(k==='subcategory')p.nominalWeight='';const weights=v5WeightOptions(p.category,p.subcategory);if(weights.length===1)p.nominalWeight=weights[0];if(p.category==='iran-coins')p.purity='900';}
function v5ProductWeightFields(p){const bullion=p.family==='bullion',opts=v5WeightOptions(p.category,p.subcategory);return `<fieldset class="v5-form-section"><legend>${t('weightSection')}</legend><div class="dc-form">${bullion?(opts.length?`<label class="dc-field">${t('weightCut')}<select name="nominalWeight" id="v5-product-weight" required><option value="">${t('selectOption')}</option>${opts.map(w=>`<option value="${w}" ${p.nominalWeight===w?'selected':''}>${v5Gram(w)}${p.subcategory==='standard-bars-troy'?' · '+t('oneOunce'):''}</option>`).join('')}</select></label>`:v5Input('nominalWeight',p.nominalWeight,'type="number" required min="0.00001" step="0.00001" dir="ltr"')):v5Input('minWeight',p.minWeight,'type="number" required min="0.00001" step="0.00001" dir="ltr"')+v5Input('maxWeight',p.maxWeight,'type="number" required min="0.00001" step="0.00001" dir="ltr"')}${v5Input('purityMilli',p.purity,'type="number" required min="0.001" max="1000" step="0.001" dir="ltr"')}${bullion?v5Input('issuer',p.issuer,'required'):''}${p.category==='combi-bars'?v5Input('segmentCount',p.segmentCount,'type="number" required min="1" step="1"')+v5Input('segmentWeight',p.segmentWeight,'type="number" required min="0.00001" step="0.00001" dir="ltr"'):''}${v5Input('quantity',p.quantity,'type="number" required min="0" step="1"')}</div></fieldset>`;}
supplierProductForm=function(){v5SupplierData();const p=state.supplierDraft;if(!p)return supplierProducts();return `${link(t('supplierProducts'),'supplierProducts')}${heading(t(p.id?'editProduct':'newProduct'))}<form id="v5-supplier-product"><fieldset class="v5-form-section"><legend>${t('productBasics')}</legend><div class="dc-form">${v5Input('productName',p.productName,'required')}${v5Input('sku',p.sku,'required dir="ltr"')}</div></fieldset><fieldset class="v5-form-section"><legend>${t('classification')}</legend>${v5TaxFields(p)}${v5ValidTax(p)?`<p class="v5-tax-path">${v5Path(p)}</p>`:''}</fieldset>${p.family?v5ProductWeightFields(p):''}<fieldset class="v5-form-section"><legend>${t('story')} / ${t('productPhotos')}</legend><label class="dc-field">${t('story')}<textarea name="story" maxlength="1000">${esc(p.story)}</textarea></label><label class="dc-field">${t('productPhotos')}<input id="v5-product-photos" type="file" multiple accept="image/jpeg,image/png"><small>${t('uploadHint')}</small></label><div class="dm-photo-list">${p.photos.map((src,i)=>`<div><img src="${src}" alt="${t('productPhotos')} ${n(i+1)}">${link(t('remove'),'v5-remove-photo',`data-id="${i}"`)}</div>`).join('')}</div></fieldset><div class="dc-actions">${btn(t('saveDraft'),'v5-save-product-draft')}<button type="submit" class="dc-button dc-primary" ${v5Uploads?'disabled':''}>${t('save')}</button></div></form>`;};
function v5SupplierItemCard(p){return `<article class="dc-product"><div class="dc-photo ${p.photos[0]?'':'v5-no-photo'}">${p.photos[0]?`<img src="${p.photos[0]}" alt="${esc(p.productName)}">`:`<span>${t('noImage')}</span>`}</div><div class="dc-product-copy"><h2>${esc(p.productName||t('newProduct'))}</h2><bdi>${esc(p.sku)}</bdi><p class="v5-tax-path">${v5Path(p)}</p><p>${t(p.family==='bullion'?'weightCut':'weightRange')}: ${p.family==='bullion'?(p.nominalWeight?v5Gram(p.nominalWeight):'—'):(p.minWeight&&p.maxWeight?v5Gram(p.minWeight)+' – '+v5Gram(p.maxWeight):'—')}</p><p>${t('purityMilli')}: ${p.purity?v5Dec(p.purity)+'‰':'—'} · ${t('quantity')}: ${p.quantity!==''?n(p.quantity):'—'}</p>${p.category==='combi-bars'?`<p>${t('segmentCount')}: ${n(p.segmentCount)} · ${v5Gram(p.segmentWeight)}</p>`:''}<span class="dc-badge">${t(p.status)}</span><div class="dc-row">${btn(t('editProduct'),'supplier-edit',false,`data-id="${p.id}"`)}${p.status==='draft'?btn(t('forReview'),'v5-product-review',true,`data-id="${p.id}"`):''}</div></div></article>`;}
supplierProducts=function(){v5SupplierData();return `${heading(t('supplierProducts'),t('myProductsHint'))}${btn(t('newProduct'),'supplier-new',true)}<div class="dc-grid v5-product-list">${state.supplierItems.map(v5SupplierItemCard).join('')||`<div class="dc-empty dc-span">${t('noSupplierProducts')}</div>`}</div>`;};
function v5ProductError(p){if(!p.productName.trim()||!p.sku.trim())return 'formFix';if(!v5ValidTax(p))return 'taxonomyError';if(!p.purity||!Number.isFinite(Number(p.purity))||Number(p.purity)<=0||Number(p.purity)>1000)return 'weightError';if(p.quantity===''||!Number.isInteger(Number(p.quantity))||Number(p.quantity)<0)return 'formFix';if(p.family==='bullion'){if(!p.nominalWeight||!Number.isFinite(Number(p.nominalWeight))||Number(p.nominalWeight)<=0||!p.issuer.trim())return 'weightError';const weights=v5WeightOptions(p.category,p.subcategory);if(weights.length&&!weights.includes(p.nominalWeight))return 'weightError';if(p.category==='iran-coins'&&Number(p.purity)!==900)return 'weightError';if(p.category==='combi-bars'&&(!Number.isInteger(Number(p.segmentCount))||Number(p.segmentCount)<1||Number(p.segmentWeight)<=0||Math.abs(Number(p.nominalWeight)-Number(p.segmentCount)*Number(p.segmentWeight))>0.000001))return 'segmentError';}else if(!p.minWeight||!p.maxWeight||!Number.isFinite(Number(p.minWeight))||!Number.isFinite(Number(p.maxWeight))||Number(p.minWeight)<=0||Number(p.maxWeight)<Number(p.minWeight))return 'weightError';if(state.supplierItems.some(x=>x.id!==p.id&&x.sku.toLowerCase()===p.sku.trim().toLowerCase()))return 'uniqueSku';return '';}
function v5StoreProduct(validate=true){const p=state.supplierDraft,err=validate?v5ProductError(p):'';if(err){rvMessage=t(err);return false;}if(v5Uploads){rvMessage=t('photoBusy');return false;}if(!p.id){const base='SP-'+Date.now().toString(36);let seq=1;p.id=base+'-'+seq;while(state.supplierItems.some(x=>x.id===p.id))p.id=base+'-'+(++seq);}p.status='draft';const i=state.supplierItems.findIndex(x=>x.id===p.id),copy=rvClone(p);if(i<0)state.supplierItems.push(copy);else state.supplierItems[i]=copy;v5SaveSupplier();rvMessage=t('productSaved');state.page='supplierProducts';return true;}
function v5MenuGroups(){if(isRetailerMode())return [
 {label:'orderGroup',icon:'shopping-bag',items:[['requests','requests'],['proformas','proformas'],['orders','orders'],['shipments','shipments']]},
 {label:'financeGroup',icon:'wallet',items:[['invoices','v5-finance','invoices'],['returns','v5-finance','returns'],['settlements','v5-finance','settlements'],['ledger','v5-finance','ledger'],['performance','v5-finance','performance']]},
 {label:'warrantyGroup',icon:'shield-check',items:[['activateFor','activateFor'],['lookupWarranty','lookupWarranty']]},

 ];if(isConsumer())return [{label:'favoriteShort',icon:'heart',items:[['favorites','favorites']]},{label:'consumerGroup',icon:'shield-check',items:[['nearestTitle','nearby'],['registeredCards','warranty'],['resale','resale'],['serviceRequests','serviceRequests']]}];if(isPartner())return [{label:'supplierGroup',icon:'factory',items:[['supplierProfile','supplierProfile'],['supplierProducts','supplierProducts'],['newProduct','supplier-new']]}];return [];}
function v5MenuItem([label,action,id]){const active=action==='v5-finance'?state.page==='financeOps'&&rvFinanceTab===id:state.page===action;return `<button class="v5-account-link" type="button" data-action="${action}" ${id?'data-id="'+id+'"':''} ${active?'aria-current="page"':''}>${t(label)}${active?icon(root.dir==='rtl'?'chevron-left':'chevron-right'):''}</button>`;}
function v5Sidebar(){return `<aside class="v5-sidebar"><details class="v5-account-menu" open><summary>${icon('menu')}${t('workMenu')}</summary><div class="v5-account-links">${v5MenuItem(['workspace','v5-workspace'])}${isRetailerMode()?v5MenuItem(['favorites','favorites']):''}${v5MenuGroups().map(g=>`<details class="v5-nav-group" ${g.items.some(([,a,id])=>state.page===a||(a==='v5-finance'&&state.page==='financeOps')||(a==='v6-finance'&&state.page==='v6-finance')||state.page==='v5-workspace')?'open':''}><summary>${icon(g.icon)}${t(g.label)}${icon('chevron-down')}</summary><div>${g.items.map(v5MenuItem).join('')}</div></details>`).join('')}<hr>${v5MenuItem(['switchAccount','v5-switch'])}${v5MenuItem(['signout','signout'])}</div></details></aside>`;}
function v5Workspace(){return `${heading(t('workspace'),t('workspaceHint'))}<div class="v5-work-grid">${v5MenuGroups().map(g=>`<section class="v5-work-card"><div class="dc-row">${icon(g.icon)}<h2>${t(g.label)}</h2></div>${g.items.map(v5MenuItem).join('')}</section>`).join('')}</div>`;}
function v5CategoryMenu(){return `<details class="v5-category-menu"><summary>${icon('menu')}${t('browseCategories')}${icon('chevron-down')}</summary><div class="v5-category-content">${v5Families.map(f=>`<section><h3>${f.pending?t(f.label):link(t(f.label),'v5-family',`data-id="${f.id}"`)}</h3>${f.pending?`<p class="dc-small dc-muted">${t('pendingTax')}</p>`:v5Categories.filter(c=>c.family===f.id).map(c=>`<button type="button" data-action="v5-category" data-id="${c.id}">${t(c.label)}${c.future?' · '+t('futureTax'):''}</button>`).join('')}</section>`).join('')}</div></details>`;}
function v5RoleMenu(){return `<section id="dc-my-menu" class="dc-role-menu" ${state.menuOpen?'':'hidden'} aria-label="${t('chooseRole')}"><div class="dc-row dc-between"><h2>${t('chooseRole')}</h2>${link(t('closeMenu'),'close-menu')}</div><div class="dc-role-grid">${roles.map(r=>`<button type="button" class="dc-role-card" data-action="choose-role" data-id="${r.id}"><span class="dc-role-icon">${icon(r.icon)}</span><strong>${t(r.label)}</strong><span class="dc-small dc-muted">${t(r.desc)}</span></button>`).join('')}</div></section>`;}
const v5PreviousPage=page;
page=function(){if(state.page==='v5-workspace'||state.page==='partnerEntry')return isMember()?v5Workspace():denied();if(state.page==='v5-suppliers')return isBuyer()?v5SuppliersPage():denied();if(state.page==='v5-supplier-catalog')return isBuyer()?v5SupplierCatalog():denied();if(state.page==='v5-collections')return v5Collections();if(state.page==='favorites')return !isPartner()?v5Favorites():denied();if(state.page==='proformas'&&isRetailerMode()){const a=rvCurrent(),saved=a.requests;try{a.requests=saved.filter(r=>r.quote);return rvRequests().replace(`<h1>${t('requests')}</h1>`,`<h1>${t('proformas')}</h1>`);}finally{a.requests=saved;}}return v5PreviousPage();};
shell=function(){v5SupplierData();root.lang=state.locale;root.dir=['fa','ar'].includes(state.locale)?'rtl':'ltr';const member=isMember(),role=isBuyer()?'retailer':state.mode==='pending'?'pending':isConsumer()?'roleConsumerShort':isPartner()?'roleSupplierShort':'guest';const work=member&&!['catalog','product','shop','nearby','login','register','v5-suppliers','v5-supplier-catalog','v5-collections','cart'].includes(state.page),count=state.basket.reduce((s,x)=>s+(x.qty||0),0),fav=rvCurrent().favs.length;root.innerHTML=`<div class="dc-demo">${t('preview')}</div><header class="dc-header v5-header"><button class="dc-brand" type="button" data-action="${isPartner()?'v5-workspace':'catalog'}"><span class="dc-wordmark" dir="ltr">DIDAR</span><span class="dc-brand-sub">${t('heroTag')}</span></button><div class="v5-header-tools"><select id="dc-locale" class="dc-locale" aria-label="${t('language')}">${[['fa','فارسی'],['ar','العربية'],['en','English'],['fr','Français']].map(([l,x])=>`<option value="${l}" ${l===state.locale?'selected':''}>${x}</option>`).join('')}</select>${!isPartner()?`<button type="button" class="v5-header-action" data-action="favorites" aria-label="${t('favorites')}">${icon('heart')}<span>${t('favoriteShort')}</span>${fav?`<b class="v5-count">${n(fav)}</b>`:''}</button>`:''}${rvCanCart()?`<button type="button" class="v5-header-action" data-action="cart" aria-label="${t('cart')} ${n(count)}">${icon('shopping-bag')}<span>${t('cart')}</span><b class="v5-count">${n(count)}</b></button>`:''}<button type="button" class="dc-button dc-primary" data-action="my-didar" ${!member?'aria-expanded="'+state.menuOpen+'" aria-controls="dc-my-menu"':''}>${icon('user-round')}${t('myDidar')}</button></div></header>${v5RoleMenu()}${v6Nav(role,work)}<div class="${work?'v5-work-layout':''}">${work?v5Sidebar():''}<main class="dc-main"><div class="dc-feedback" role="status" aria-live="polite">${rvMessage?esc(rvMessage):state.toastKey?t(state.toastKey):''}</div>${!rvStorage?`<p class="dc-notice">${t('noStorage')}</p>`:''}${state.mode==='pending'?`<p class="dc-notice">${t('pendingMembership')}</p>`:''}${v5Uploads?`<p role="status">${t('photoBusy')}</p>`:''}${rvDrawer&&rvCanCart()?`<aside class="rv-drawer" aria-label="${t('draftCart')}">${btn(t('closeCart'),'rv-close')}${rvBasket()}</aside>`:''}${page()}</main></div><footer class="dc-footer"><p>${t('persistNotice')}</p><p>${t('imageNote')}</p></footer>`;initIcons();};
const v5PreviousNavigate=navigate;
navigate=function(action,id){rvMessage='';state.toastKey='';if(action==='my-didar'&&isMember()){state.page='v5-workspace';rvDrawer=false;state.menuOpen=false;return;}if(action==='v5-switch'){state.menuOpen=!state.menuOpen;return;}if(action==='v5-workspace'){if(isMember()){state.page=action;rvDrawer=false;}return;}if(action==='v5-suppliers'){if(isBuyer()){v5SupplierId='';state.page=action;rvDrawer=false;}return;}if(action==='v5-supplier'){if(isBuyer()&&v5Suppliers.some(s=>s.id===id)){v5SupplierId=id;v5Filter={family:'',category:'',subcategory:'',weight:''};state.search='';state.collection='allCollections';state.page='v5-supplier-catalog';rvDrawer=false;}return;}if(action==='v5-back-supplier'){if(isBuyer())state.page='v5-supplier-catalog';return;}if(action==='v5-collections'){v5SupplierId='';state.page=action;rvDrawer=false;return;}if(action==='v5-finance'){if(isRetailerMode()&&['invoices','returns','settlements','ledger','performance'].includes(id)){rvFinanceTab=id;state.page='financeOps';rvDrawer=false;}return;}
if(action==='v5-family'||action==='v5-category'){const c=action==='v5-category'?v5ByCategory(id):null;v5Filter={family:c?c.family:id,category:c?c.id:'',subcategory:'',weight:''};v5SupplierId='';state.category='all';state.collection='allCollections';state.search='';state.page='catalog';rvDrawer=false;return;}
if(action==='reset-filters'){v5Filter={family:'',category:'',subcategory:'',weight:''};state.category='all';state.collection='allCollections';state.search='';return;}
if(action==='catalog')v5SupplierId='';
if(action==='collection-jump'){v5SupplierId='';v5Filter={family:'',category:'',subcategory:'',weight:''};}
if(action==='collection-filter'){state.collection=id;return;}
if(action==='signout'||action==='choose-role'){if(isPartner())v5SaveSupplier();v5SupplierOwner=null;v5SupplierId='';v5Filter={family:'',category:'',subcategory:'',weight:''};}
if(action==='v5-save-profile'&&isPartner()){v5SaveSupplier();rvMessage=t('supplierSaved');return;}
if(action==='supplier-new'&&isPartner()){v5SupplierData();state.supplierDraft=v5NewProduct();state.page='supplierProductForm';v5SaveSupplier();return;}
if(action==='supplier-edit'&&isPartner()){v5SupplierData();const p=state.supplierItems.find(p=>p.id===id);if(p){state.supplierDraft=rvClone(p);state.page='supplierProductForm';v5SaveSupplier();}return;}
if(action==='v5-remove-photo'&&isPartner()){state.supplierDraft.photos.splice(Number(id),1);v5SaveSupplier();return;}
if(action==='v5-save-product-draft'&&isPartner()){v5StoreProduct(false);return;}
if(action==='v5-product-review'&&isPartner()){const p=state.supplierItems.find(p=>p.id===id);if(!p)return;const error=v5ProductError(p);if(error)rvMessage=t(error);else if(!p.photos.length)rvMessage=t('reviewImages');else{p.status='reviewPending';v5SaveSupplier();}return;}
v5PreviousNavigate(action,id);};
function v5ReadFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
root.addEventListener('input',e=>{const x=e.target,p=state.supplierProfile,d=state.supplierDraft;if(x.form?.id==='v5-supplier-profile'&&x.name){const key=x.name==='legalType'?'entity':x.name==='supplierType'?'type':x.name;p[key]=x.type==='checkbox'?x.checked:x.value;v5SaveSupplier();}if(x.form?.id==='v5-supplier-product'&&x.name){d[x.name==='purityMilli'?'purity':x.name]=x.value;v5SaveSupplier();}if(x.id==='v5-supplier-search'){v5SupplierSearch=x.value;const results=v5SuppliersPage().match(/<div class="v5-supplier-grid" id="v5-supplier-results">([\s\S]*)<\/div>$/);if(results)root.querySelector('#v5-supplier-results').innerHTML=results[1];initIcons();}});
root.addEventListener('change',e=>{const x=e.target,p=state.supplierProfile,d=state.supplierDraft;
if(x.id.startsWith('v5-filter-')){const key=x.id.slice('v5-filter-'.length);v5Filter[key]=x.value;if(key==='family'){v5Filter.category='';v5Filter.subcategory='';v5Filter.weight='';}if(key==='category'){v5Filter.family=v5ByCategory(x.value)?.family||v5Filter.family;v5Filter.subcategory='';v5Filter.weight='';}if(key==='subcategory')v5Filter.weight='';shell();}
if(x.form?.id==='v5-supplier-profile'&&['legalType','supplierType','hasT'].includes(x.name)){p[x.name==='legalType'?'entity':x.name==='supplierType'?'type':x.name]=x.name==='hasT'?x.checked:x.value;v5SaveSupplier();shell();}
if(x.dataset.v5LicenseType){const key=x.dataset.v5LicenseType;p.licenses=x.checked?[...new Set([...p.licenses,key])]:p.licenses.filter(v=>v!==key);v5SaveSupplier();shell();}
if(x.dataset.v5Scope){p.scope=x.checked?[...new Set([...p.scope,x.dataset.v5Scope])]:p.scope.filter(v=>v!==x.dataset.v5Scope);v5SaveSupplier();root.querySelector('#v5-selected-scopes').innerHTML=v5ScopeSummary(p);const cat=v5ByType(x.dataset.v5Scope)?.category,parent=root.querySelector('[data-v5-scope-category="'+cat+'"]');if(parent){const c=v5ByCategory(cat),count=c.types.filter(s=>p.scope.includes(s.id)).length;parent.checked=count===c.types.length;parent.indeterminate=count>0&&count<c.types.length;}}
if(x.dataset.v5ScopeCategory){const c=v5ByCategory(x.dataset.v5ScopeCategory),ids=c.types.map(t=>t.id);p.scope=x.checked?[...new Set([...p.scope,...ids])]:p.scope.filter(id=>!ids.includes(id));v5SaveSupplier();root.querySelector('#v5-selected-scopes').innerHTML=v5ScopeSummary(p);ids.forEach(id=>{const child=root.querySelector('[data-v5-scope="'+id+'"]');if(child)child.checked=x.checked;});}
if(x.id.startsWith('v5-product-')&&['family','category','subcategory'].includes(x.name)){v5SetProductTax(d,x.name,x.value);v5SaveSupplier();shell();}
if(x.id==='v5-product-weight'){d.nominalWeight=x.value;v5SaveSupplier();}
if(x.dataset.v5LicenseFile&&isPartner()){const file=x.files[0],key=x.dataset.v5LicenseFile,owner=rvAccount,target=p;if(!rvFileOK(file)){rvMessage=t('badFile');shell();return;}v5Uploads++;v5ReadFile(file).then(data=>{target[key+'File']={name:file.name,type:file.type,data};if(rvAccount===owner)v5SaveSupplier();else rvSave();}).catch(()=>rvMessage=t('badFile')).finally(()=>{v5Uploads--;shell();});}
if(x.id==='v5-product-photos'&&isPartner()){const files=[...x.files],target=d,owner=rvAccount;if(files.length+d.photos.length>3||files.some(f=>!rvFileOK(f)||f.type==='application/pdf')){rvMessage=t('uploadError');shell();return;}v5Uploads++;Promise.all(files.map(v5ReadFile)).then(images=>{target.photos.push(...images);if(rvAccount===owner)v5SaveSupplier();else rvSave();}).catch(()=>rvMessage=t('badFile')).finally(()=>{v5Uploads--;shell();});}
});
root.addEventListener('submit',e=>{const f=e.target;if(!['v5-supplier-profile','v5-supplier-product'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();if(!isPartner())return;rvMessage='';const values=new FormData(f);if(f.id==='v5-supplier-profile'){const p=state.supplierProfile;for(const [key,v] of values.entries()){if(typeof v==='string')p[key==='legalType'?'entity':key==='supplierType'?'type':key]=v.trim();}p.hasT=!!values.get('hasT');const keys=p.entity==='person'?['fullName','personId']:['companyName','companyId','registrationNo','representative','representativeId'];const goodIds=p.entity==='person'?/^\d{10}$/.test(p.personId||''):/^\d{11}$/.test(p.companyId||'')&&/^\d{10}$/.test(p.representativeId||'');if(v5Uploads)rvMessage=t('photoBusy');else if(!goodIds||[...keys,'businessName','phone','province','city','address'].some(k=>!p[k]?.trim())||!p.scope.length||!p.licenses.length||p.licenses.some(k=>!p[k+'Number']?.trim()||!p[k+'File'])||(p.type==='manufacturer'&&p.hasT&&!p.tCode?.trim()))rvMessage=t('supplierIncomplete');else{p.reviewStatus='underReview';rvMessage=t('reviewNote');}v5SaveSupplier();}else{const p=state.supplierDraft;for(const [k,v] of values.entries())if(typeof v==='string')p[k==='purityMilli'?'purity':k]=v.trim();v5StoreProduct(true);}shell();},true);

const v5OldRequest=rvRequest;
rvRequest=function(){let out=v5OldRequest();for(const m of models)out=out.replaceAll(`<span>${t('product'+m.id)} ·`, `<span>${t('product'+m.id)}<small class="v5-tax-path">${v5Path(m)}</small> ·`);return out;};
const v5OldFulfillment=rvFulfillmentRows;
rvFulfillmentRows=function(shipping){let out=v5OldFulfillment(shipping);for(const m of models)out=out.replaceAll(`<span>${t('product'+m.id)}</span>`,`<span>${t('product'+m.id)}<small class="v5-tax-path">${v5Path(m)}</small></span>`);return out;};
const v5OldFinance=rvFinance;
rvFinance=function(){let out=v5OldFinance();for(const m of models)out=out.replaceAll(info(t('selectProduct'),t('product'+m.id)),info(t('selectProduct'),t('product'+m.id))+info(t('classification'),v5Path(m)));return out;};
const v5ShopProfile=profile;
profile=function(){let out=v5ShopProfile();for(const m of models)out=out.replaceAll(`<h3>${t('product'+m.id)}</h3>`,`<h3>${t('product'+m.id)}</h3><p class="v5-tax-path">${v5Path(m)}</p>`);return out;};

let v6FinanceTab='ledger',v6Period='all';
function v6Nav(role,work){const workspace=`<button type="button" data-action="v5-workspace" ${work?'aria-current="page"':''}>${icon('layout-dashboard')}${t('workspace')}</button>`;return `<nav class="dc-nav v5-store-nav" aria-label="${t('portal')}">${isPartner()?workspace:`${v5CategoryMenu()}<button type="button" data-action="catalog" ${state.page==='catalog'?'aria-current="page"':''}>${t('catalog')}</button><button type="button" data-action="v5-collections" ${state.page==='v5-collections'?'aria-current="page"':''}>${t('collections')}</button>${isBuyer()?`<button type="button" data-action="v5-suppliers" ${state.page.startsWith('v5-supplier')?'aria-current="page"':''}>${t('suppliers')}</button>`:''}${isBuyer()||isConsumer()?workspace:''}`}<span class="v5-role-label">${t(role)}</span></nav>`;}

function v6Balance(value,unit){return `<strong>${n(Math.abs(value),unit==='goldUnit'?5:0)} ${t(unit)}</strong><p>${t(value>0?'v6Receivable':value<0?'v6Payable':'v6Zero')}</p>`;}
function v6Finance(){if(!isPartner())return denied();const ledger=v6Ledger(),gold=ledger.reduce((s,r)=>s+r.gold,0),cash=ledger.reduce((s,r)=>s+r.cash,0),periodRows=ledger.filter(r=>v6Period==='all'||r.date.startsWith(v6Period)),rows=periodRows.filter(r=>['ledger','performance'].includes(v6FinanceTab)||r.kind===v6FinanceTab);let runningGold=0,runningCash=0;const balances=new Map(ledger.map(r=>{runningGold+=r.gold;runningCash+=r.cash;return [r.id,{gold:runningGold,cash:runningCash}];}));return `${heading(t('v6Finance'),t('v6Note'))}<div class="dc-summary"><div><h3>${t('goldBalance')} · ${t('v6All')}</h3>${v6Balance(gold,'goldUnit')}</div><div><h3>${t('cashBalance')} · ${t('v6All')}</h3>${v6Balance(cash,'cashUnit')}</div></div><div class="dc-row v6-tabs">${v6FinanceTabs.map(k=>btn(t(v6FinanceLabels[k]),'v6-finance',v6FinanceTab===k,`data-id="${k}"`)).join('')}</div><label class="dc-field">${t('period')}<select id="v6-period">${['all','2026-07','2026-08','2026-09'].map(k=>`<option value="${k}" ${v6Period===k?'selected':''}>${k==='all'?t('allTime'):k}</option>`).join('')}</select></label>${v6FinanceTab==='settlements'?`<section class="dc-box"><h2>${t('v6Due')}</h2><p>${t('v6Pending')}</p>${v6Balance(gold,'goldUnit')}${v6Balance(cash,'cashUnit')}</section>`:''}${v6FinanceTab==='performance'?`<section class="dc-box"><h2>${t('v6NetSales')} · ${t('goldUnit')}</h2>${['2026-07','2026-08','2026-09'].filter(m=>v6Period==='all'||m===v6Period).map(m=>{const value=periodRows.filter(r=>r.date.startsWith(m)&&r.kind!=='settlements').reduce((s,r)=>s+r.gold,0);return `<div class="v6-chart-row"><bdi>${m}</bdi><strong>${n(value,5)} ${t('goldUnit')}</strong><meter min="-40" max="40" value="${value}" aria-label="${m}: ${n(value,5)} ${t('goldUnit')}"></meter></div>`;}).join('')}</section>`:''}<section class="dc-box"><h2>${t(v6FinanceLabels[v6FinanceTab])}</h2>${rows.map(r=>`<details class="dc-stockist"><summary><bdi>${r.id}</bdi> · <bdi>${r.date}</bdi> · ${t(v6FinanceLabels[r.kind])}</summary><dl class="dc-info">${info(t('v6Reference'),esc(r.ref))}${info(t('quantity'),n(r.qty))}${info(t('goldUnit'),n(r.gold,5))}${info(t('cashUnit'),n(r.cash))}${r.due?info(t('v6DueDate'),r.due):''}${info(t('status'),t('approved'))}</dl>${v6FinanceTab==='ledger'?`<h3>${t('v6Statement')}</h3>${v6Balance(balances.get(r.id).gold,'goldUnit')}${v6Balance(balances.get(r.id).cash,'cashUnit')}`:''}</details>`).join('')||`<p>${t('noHistory')}</p>`}</section>`;}
