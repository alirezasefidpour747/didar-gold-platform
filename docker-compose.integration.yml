services:
  k01-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${K01_TEST_DB_USER:?K01_TEST_DB_USER is required}
      POSTGRES_PASSWORD: ${K01_TEST_DB_PASSWORD:?K01_TEST_DB_PASSWORD is required}
      POSTGRES_DB: ${K01_TEST_DB_NAME:?K01_TEST_DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - k01_test_pg_data:/var/lib/postgresql/data

  k01-test-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_PORT: "3000"
      SERVE_STATIC: "true"
      CORS_ALLOWED_ORIGINS: https://integration.example.invalid
      DATABASE_URL: ${K01_TEST_DATABASE_URL:?K01_TEST_DATABASE_URL is required}
      DATABASE_READINESS_TIMEOUT_MS: "2000"
    depends_on:
      k01-test-db:
        condition: service_healthy

volumes:
  k01_test_pg_data:
